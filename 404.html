    :root { --parchment:#f3eddf; --ink:#202620; --soft:#616861; --pine:#294b3c; --brass:#a88749; --rule:rgba(32,38,32,.17); }

    h1 { margin:70px 0 15px; font-family:"Cormorant Garamond",Georgia,serif; font-size:clamp(3rem,8vw,5.6rem); font-weight:400; line-height:.95; letter-spacing:-.04em; }
    p { color:var(--soft); line-height:1.7; }
    nav { margin-top:40px; display:flex; flex-wrap:wrap; gap:14px; }
    a { padding:14px 18px; border:1px solid var(--rule); color:var(--pine); font-weight:600; text-decoration:none; }
    a:hover, a:focus-visible { background:#faf7f0; border-color:var(--brass); }
  </style>
</head>
